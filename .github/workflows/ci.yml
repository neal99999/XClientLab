name: iOS CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

# 同一分支只保留最新一次运行：连续 push 时自动取消旧任务，避免旧的失败结果干扰判断
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Xcode 27.x)
    # 本项目是 objectVersion 110（Xcode 27 工程格式），macos-latest 目前是
    # macOS 26 + Xcode 26.6，打不开这个工程；xcode-27 镜像自带 Xcode 27.0~27.2。
    # 该镜像目前是 public preview，排队可能稍慢。
    runs-on: xcode-27
    timeout-minutes: 60

    env:
      PROJECT: XClientLab.xcodeproj
      SCHEME: XClientLab
      # 快照基线在本地 iOS 27.1 runtime 录制（见 README「验证结果」），CI 必须用同一
      # runtime 渲染才能逐像素一致（27.2 上 SF Symbol/渐变类组件有像素差异，
      # 已在 run #4 验证：3 个含系统资源的快照挂、纯文本的过）。不指定机型，
      # 由 xcodebuild 在该 runtime 下挑可用设备（快照用固定 360x220 的
      # ViewImageConfig，机型无关）。若镜像滚动后 27.1 runtime 被移除，
      # 需显式重录基线并把这里改成对应 OS。
      DESTINATION: "platform=iOS Simulator,OS=27.1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Select Xcode 27.1
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_27.1.app ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_27.1.app/Contents/Developer" >> "$GITHUB_ENV"
          else
            # 镜像滚动更新时 27.1 可能被 27.x 补丁版替换，退回到最高的 27.x
            latest="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)"
            if [ -z "$latest" ]; then
              echo "::error::No Xcode 27.x found on this runner. Use the 'xcode-27' image."
              exit 1
            fi
            echo "Xcode 27.1 not found, falling back to $latest"
            echo "DEVELOPER_DIR=$latest/Contents/Developer" >> "$GITHUB_ENV"
          fi

      - name: Show Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ github.workspace }}/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('XClientLab.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Packages
        run: |
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -resolvePackageDependencies

      - name: Run Unit, Snapshot & UI Tests
        run: |
          set -o pipefail
          mkdir -p TestResults
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults/CI.xcresult \
            -skipPackagePluginValidation \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            TestResults
            DerivedData/Logs/Test
          if-no-files-found: ignore
          retention-days: 7
