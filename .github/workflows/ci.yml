name: iOS CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

# 同一分支只保留最新一次运行：连续 push 时自动取消旧任务，避免旧的失败结果干扰判断
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Xcode 27.x)
    # 本项目是 objectVersion 110（Xcode 27 工程格式），macos-latest 目前是
    # macOS 26 + Xcode 26.6，打不开这个工程；xcode-27 镜像自带 Xcode 27.0~27.2。
    # 该镜像目前是 public preview，排队可能稍慢。
    runs-on: xcode-27
    timeout-minutes: 45

    env:
      PROJECT: XClientLab.xcodeproj
      SCHEME: XClientLab
      # DESTINATION 由「Resolve simulator destination」步骤动态解析后写入
      # GITHUB_ENV；不在 job 级写死，因为这个 preview 镜像上的设备清单
      # 和常规 Xcode 安装不一致（见该步骤内的三轮 run 教训注释）。

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Select Xcode 27.1
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_27.1.app ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_27.1.app/Contents/Developer" >> "$GITHUB_ENV"
          else
            # 镜像滚动更新时 27.1 可能被 27.x 补丁版替换，退回到最高的 27.x
            latest="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)"
            if [ -z "$latest" ]; then
              echo "::error::No Xcode 27.x found on this runner. Use the 'xcode-27' image."
              exit 1
            fi
            echo "Xcode 27.1 not found, falling back to $latest"
            echo "DEVELOPER_DIR=$latest/Contents/Developer" >> "$GITHUB_ENV"
          fi

      # 放在所有可能失败的步骤之前：任何后续失败都能在日志里对照工具链清单
      - name: Show Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available
          echo "--- iPhone devicetypes ---"
          xcrun simctl list devicetypes | grep -iE "iphone" || echo "(no iPhone devicetypes on this image)"

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ github.workspace }}/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('XClientLab.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Packages
        run: |
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -resolvePackageDependencies

      - name: Resolve simulator destination
        run: |
          # 三轮 run 的教训，这里不再假设镜像上有什么机型：
          #  - run #4：预装设备按 name+OS 动态选择 → 构建、全部测试都能跑通
          #    （快照因 27.2/27.1 渲染差异挂过，测试代码已用 precision 0.97/0.98 放宽）。
          #  - run #5：destination 只写 OS=27.1 不写机型 → xcodebuild exit 70
          #    （27.1 runtime 上预装设备无法被"只按 OS"的默认匹配选中）。
          #  - run #6：硬编码 devicetype 标识符 iPhone-17 在这个 preview 镜像上
          #    不存在（诊断 grep 输出为空），simctl create 失败。
          # 所以：动态发现 devicetype / 预装设备，每个候选 destination 都先用
          # xcodebuild -showdestinations 验证"真的能解析"再采用；全部失败则把
          # 完整设备清单打进日志，供下一轮对症处理。
          set -euo pipefail

          RUNTIMES="$(xcrun simctl list runtimes)"
          DEVICES="$(xcrun simctl list devices available)"
          DEVTYPES="$(xcrun simctl list devicetypes)"

          show_destinations() {
            xcodebuild -project "$PROJECT" -scheme "$SCHEME" -showdestinations 2>/dev/null || true
          }

          # 只取 -showdestinations 的 Available 段，避免误匹配 Ineligible 里的同款；
          # 老格式没有分段标记时退回全量输出。
          available_destinations() {
            local out
            out="$(show_destinations)"
            local avail
            avail="$(awk '/Ineligible/{exit} /Available/{found=1; next} found{print}' <<< "$out")"
            if [ -z "$avail" ]; then
              avail="$out"
            fi
            printf '%s' "$avail"
          }

          # 候选必须同时命中 OS 和 name（兼容 OS=/OS:、name=/name: 两种格式）
          destination_resolves() {
            local ospat="$1" name="$2" avail
            avail="$(available_destinations)"
            echo "$avail" | grep -Eq "OS[:=]${ospat}.*name[:=]${name}|name[:=]${name}.*OS[:=]${ospat}"
          }

          # 从 devices available 输出里取指定 OS 段的第一台预装设备名
          pick_preinstalled() {
            local os="$1" name ospat
            name="$(awk -v os="$os" '
              $0 ~ "^-- iOS " os " --" {sec=1; next}
              /^-- / {sec=0}
              sec && /^[ \t]+[^ \t].* \(/ {
                line=$0
                sub(/\(.*/, "", line)
                gsub(/^[ \t]+|[ \t]+$/, "", line)
                print line
                exit
              }' <<< "$DEVICES" || true)"
            [ -n "$name" ] || return 1
            ospat="${os//./\\.}"
            destination_resolves "$ospat" "$name" || return 1
            DEST_NAME="$name"
            DEST_OS="$os"
            echo "✅ using preinstalled $name on iOS $os"
          }

          DEST_NAME=""
          DEST_OS=""

          # —— 首选：在 iOS 27.1（快照基线 runtime）上新建一台设备 ——
          # 机型从镜像实际存在的 devicetype 里挑，不硬编码型号名。
          if grep -q "iOS 27.1" <<< "$RUNTIMES"; then
            runtime_id="$(grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-27-1' <<< "$RUNTIMES" | head -1 || true)"
            devtype="$(grep -oE 'com\.apple\.CoreSimulator\.SimDeviceType\.iPhone[^)]*' <<< "$DEVTYPES" | head -1 || true)"
            if [ -n "$runtime_id" ] && [ -n "$devtype" ]; then
              xcrun simctl delete "CI-iPhone-27-1" 2>/dev/null || true
              xcrun simctl delete "CI-iPhone-17-iOS-27-1" 2>/dev/null || true
              if xcrun simctl create "CI-iPhone-27-1" "$devtype" "$runtime_id"; then
                if destination_resolves '27\.1' 'CI-iPhone-27-1'; then
                  DEST_NAME="CI-iPhone-27-1"
                  DEST_OS="27.1"
                  echo "✅ created CI-iPhone-27-1 on iOS 27.1 ($devtype)"
                fi
              fi
            fi
          fi

          # —— 次选/兜底：预装设备按 name+OS 钉死（run #4 验证过这条路能跑通全部测试） ——
          if [ -z "$DEST_NAME" ]; then
            for os in 27.1 27.2; do
              pick_preinstalled "$os" && break
            done
          fi

          # —— 再兜底：镜像上实际存在的最高 iOS 27.x runtime ——
          if [ -z "$DEST_NAME" ]; then
            highest="$(grep -oE 'iOS 27\.[0-9]+' <<< "$RUNTIMES" | sort -V | tail -1 | cut -d' ' -f2 || true)"
            if [ -n "$highest" ]; then
              pick_preinstalled "$highest" || true
            fi
          fi

          if [ -z "$DEST_NAME" ]; then
            echo "::error::No usable iOS 27.x simulator destination. Full inventory below."
            echo "--- runtimes ---"
            echo "$RUNTIMES"
            echo "--- devices available ---"
            echo "$DEVICES"
            echo "--- devicetypes ---"
            echo "$DEVTYPES"
            exit 1
          fi

          DESTINATION="platform=iOS Simulator,name=$DEST_NAME,OS=$DEST_OS"
          echo "Selected destination: $DESTINATION"
          echo "DESTINATION=$DESTINATION" >> "$GITHUB_ENV"

      - name: Run Unit, Snapshot & UI Tests
        run: |
          set -o pipefail
          mkdir -p TestResults
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults/CI.xcresult \
            -skipPackagePluginValidation \
            -disableAutomaticPackageResolution \
            -retry-tests-on-failure \
            -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            TestResults
            DerivedData/Logs/Test
          if-no-files-found: ignore
          retention-days: 7
