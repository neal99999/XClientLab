name: iOS CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

# 同一分支只保留最新一次运行：连续 push 时自动取消旧任务，避免旧的失败结果干扰判断
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Xcode 27.x)
    # 本项目是 objectVersion 110（Xcode 27 工程格式），macos-latest 目前是
    # macOS 26 + Xcode 26.6，打不开这个工程；xcode-27 镜像自带 Xcode 27.0~27.2。
    # 该镜像目前是 public preview，排队可能稍慢。
    runs-on: xcode-27
    timeout-minutes: 60

    env:
      PROJECT: XClientLab.xcodeproj
      SCHEME: XClientLab
      # 快照基线在本地 iOS 27.1 runtime 录制（见 README「验证结果」），CI 必须用同一
      # runtime 渲染才能逐像素一致（27.2 上 SF Symbol/渐变类组件有像素差异，
      # 已在 run #4 验证：3 个含系统资源的快照挂、纯文本的过）。
      # 27.1 runtime 上的预装机型不可靠（run #5 exit 70：OS=27.1 不指定机型时
      # xcodebuild 匹配不到 destination），所以下面的步骤会在 27.1 runtime 上
      # 显式创建一台标准 iPhone 17，destination 按名字钉死。快照用固定 360x220 的
      # ViewImageConfig，机型不影响像素。若日后 27.1 runtime 被镜像移除，
      # 需显式重录基线并把这里的 OS 改成对应版本。
      DESTINATION: "platform=iOS Simulator,name=CI-iPhone-17-iOS-27-1,OS=27.1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Select Xcode 27.1
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_27.1.app ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_27.1.app/Contents/Developer" >> "$GITHUB_ENV"
          else
            # 镜像滚动更新时 27.1 可能被 27.x 补丁版替换，退回到最高的 27.x
            latest="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)"
            if [ -z "$latest" ]; then
              echo "::error::No Xcode 27.x found on this runner. Use the 'xcode-27' image."
              exit 1
            fi
            echo "Xcode 27.1 not found, falling back to $latest"
            echo "DEVELOPER_DIR=$latest/Contents/Developer" >> "$GITHUB_ENV"
          fi

      - name: Ensure iOS 27.1 device exists
        run: |
          set -euo pipefail
          if ! xcrun simctl list runtimes | grep -q "iOS 27.1"; then
            echo "::error::iOS 27.1 runtime not installed on this runner; snapshot baselines were recorded on 27.1."
            xcrun simctl list runtimes
            exit 1
          fi
          # 幂等：先删旧的同名设备再创建
          xcrun simctl delete "CI-iPhone-17-iOS-27-1" 2>/dev/null || true
          if ! xcrun simctl create "CI-iPhone-17-iOS-27-1" \
              "com.apple.CoreSimulator.SimDeviceType.iPhone-17" \
              "com.apple.CoreSimulator.SimRuntime.iOS-27-1"; then
            echo "::error::simctl create failed; available iPhone device types:"
            xcrun simctl list devicetypes | grep -E "iPhone-1[678]" || true
            exit 1
          fi

      - name: Show Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ github.workspace }}/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('XClientLab.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Packages
        run: |
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -resolvePackageDependencies

      - name: Run Unit, Snapshot & UI Tests
        run: |
          set -o pipefail
          mkdir -p TestResults
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults/CI.xcresult \
            -skipPackagePluginValidation \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            TestResults
            DerivedData/Logs/Test
          if-no-files-found: ignore
          retention-days: 7
